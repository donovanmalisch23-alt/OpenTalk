# SPDX-License-Identifier: GPL-3.0-only
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSVC, Qt 6.8 LTS)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-x64-windows-${{ hashFiles('vcpkg.json') }}

      - name: Set up vcpkg at the pinned commit
        shell: pwsh
        run: |
          $sha = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          $root = "$env:RUNNER_TEMP/vcpkg"
          git clone --quiet https://github.com/microsoft/vcpkg $root
          git -C $root checkout --quiet $sha
          & "$root/bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/vcpkg-cache" | Out-Null
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_BINARY_CACHE=$env:RUNNER_TEMP/vcpkg-cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset windows-msvc-release

      - name: Put vcpkg DLLs (OpenSSL, libsodium) on PATH
        shell: pwsh
        run: |
          $bin = (Resolve-Path build/windows-msvc-release/vcpkg_installed/x64-windows/bin).Path
          if (-not (Test-Path "$bin/libssl-3-x64.dll")) { throw "vcpkg did not provide libssl-3-x64.dll" }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "OPENSSL_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        run: cmake --build --preset windows-msvc-release

      - name: Test
        run: ctest --preset windows-msvc-release

      - name: Package portable build
        shell: pwsh
        run: |
          $stage = "OpenTalk-portable"
          New-Item -ItemType Directory -Force $stage | Out-Null
          # qt_standard_project_setup() may place executables at the build root on Windows.
          foreach ($name in "OpenTalk.exe", "opentalk-server.exe", "opentalk-ping.exe") {
            $exe = Get-ChildItem -Path build/windows-msvc-release -Recurse -Filter $name | Select-Object -First 1
            if (-not $exe) { throw "$name was not found in the build directory" }
            Write-Host "Packaging $($exe.FullName)"
            Copy-Item $exe.FullName $stage/
          }
          windeployqt --release --compiler-runtime --no-translations --no-system-d3d-compiler --no-opengl-sw `
            "$stage/OpenTalk.exe" "$stage/opentalk-server.exe" "$stage/opentalk-ping.exe"
          # OpenSSL and libsodium from vcpkg (the same build the tests used).
          Copy-Item "$env:OPENSSL_BIN/*.dll" $stage/
          # windeployqt skips Qt's OpenSSL TLS plugin because OpenSSL is not part of Qt; copy it.
          $plugin = Get-ChildItem -Path "$env:RUNNER_WORKSPACE/Qt" -Recurse -Filter qopensslbackend.dll | Select-Object -First 1
          if (-not $plugin) { throw "qopensslbackend.dll not found in the Qt installation" }
          Copy-Item $plugin.FullName "$stage/tls/"
          if (-not (Test-Path "$stage/tls/qopensslbackend.dll")) { throw "Qt's OpenSSL TLS plugin was not deployed" }
          New-Item -ItemType File "$stage/OpenTalk.portable" | Out-Null
          Copy-Item LICENSE "$stage/LICENSE.txt"
          Copy-Item README.md "$stage/README.md"

      - name: Smoke-test the portable package
        shell: pwsh
        run: |
          # Only Windows itself on PATH: the package must not rely on the build machine's Qt or OpenSSL.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $stage = "OpenTalk-portable"
          $out = New-TemporaryFile
          $server = Start-Process -FilePath "$stage/opentalk-server.exe" -NoNewWindow -PassThru `
            -RedirectStandardOutput $out `
            -ArgumentList "--data-dir `"$env:RUNNER_TEMP/smoke-data`" --listen 127.0.0.1 --port 0 --allow-guests"
          for ($i = 0; $i -lt 30 -and -not (Select-String -Path $out -Pattern "Press Ctrl" -Quiet); $i++) { Start-Sleep 1 }
          $text = Get-Content $out -Raw
          Write-Host $text
          $port = [regex]::Match($text, "running on port (\d+)").Groups[1].Value
          $fingerprint = [regex]::Match($text, "(SHA256:[0-9A-F:]+)").Groups[1].Value
          if (-not $port) { Stop-Process $server -ErrorAction SilentlyContinue; throw "packaged server did not start" }
          & "$stage/opentalk-ping.exe" 127.0.0.1 --port $port --fingerprint $fingerprint
          $code = $LASTEXITCODE
          Stop-Process $server
          if ($code -ne 0) { throw "packaged opentalk-ping could not connect (exit code $code)" }

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: OpenTalk-portable-windows-x64
          path: OpenTalk-portable
          retention-days: 14

  linux:
    name: Linux (GCC, format, sanitizers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-base-dev libqt6sql6-sqlite libsodium-dev libssl-dev libopus-dev pkg-config ninja-build clang-format

      - name: Check formatting
        run: find src tests -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror

      - name: Build and test
        run: |
          cmake --preset linux-debug
          cmake --build --preset linux-debug
          ctest --preset linux-debug

      - name: Build and test with AddressSanitizer and UBSan
        run: |
          cmake --preset linux-asan
          cmake --build --preset linux-asan
          ctest --preset linux-asan

  fuzz:
    name: Fuzz protocol parsers (smoke run)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-base-dev libqt6sql6-sqlite libsodium-dev libssl-dev libopus-dev pkg-config ninja-build clang libclang-rt-18-dev

      - name: Build fuzzers
        run: |
          cmake --preset linux-fuzz
          cmake --build --preset linux-fuzz

      - name: Run each fuzzer for 1 minute
        run: |
          for target in frame_decoder message_decoder session server_core; do
            mkdir -p "corpus/$target"
            if [ -d "tests/fuzz/seeds/$target" ]; then cp tests/fuzz/seeds/$target/* "corpus/$target/"; fi
            echo "::group::fuzz_$target"
            "build/linux-fuzz/tests/fuzz/fuzz_$target" -max_total_time=60 "corpus/$target"
            echo "::endgroup::"
          done
